services:
  jenkins:
    build:
      context: ..
      dockerfile: bonus/Dockerfile
    user: "0:0"
    container_name: my_marvin
    ports:
      - "3333:8080"
      - "50000:50000"
    env_file:
      - .env
    volumes:
      - jenkins_data:/var/jenkins_home
      - ../my_marvin.yml:/var/jenkins_home/casc_configs/my_marvin.yml:ro
      - ../job_dsl.groovy:/var/jenkins_home/job_dsl.groovy:ro
      - ./my_bonus.yml:/var/jenkins_home/casc_configs/my_bonus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_data:
